version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: dayflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: dayflow
      POSTGRES_PASSWORD: dayflow123
      POSTGRES_DB: dayflow
    ports:
      - "5432:5432"
    volumes:
      - dayflow_pgdata:/var/lib/postgresql/data

volumes:
  dayflow_pgdata: